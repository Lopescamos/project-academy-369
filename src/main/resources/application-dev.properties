# Carga variables de .env (en la raíz del proyecto, junto al pom.xml) como si fueran propiedades.
# Si esto no funciona en tu versión exacta de Boot, exporta el .env en tu shell antes de levantar
# la app (p. ej. con `export $(grep -v '^#' .env | xargs)`) o usa un plugin de tu IDE para .env.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:olimpiadas369}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.olimpiadas369=DEBUG
logging.level.org.hibernate.SQL=DEBUG

server.port=${SERVER_PORT:8080}

springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true