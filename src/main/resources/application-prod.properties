# Render inyecta estas variables como env vars reales (Settings -> Environment) — no hay .env en prod.
# Supabase da host/puerto/db/usuario/password por separado en Project Settings -> Database;
# aquí se compone la URL JDBC. sslmode=require es obligatorio con Supabase.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.com.olimpiadas369=INFO
logging.level.org.hibernate.SQL=WARN

# Render asigna el puerto por la variable PORT — no uses un valor fijo
server.port=${PORT:8080}

# Nunca expuesto públicamente en prod
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:false}