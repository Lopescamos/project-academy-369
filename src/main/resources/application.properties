spring.application.name=olimpiadas369-backend

# Perfil activo por defecto si no se especifica (se sobreescribe con SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=America/Lima

# --- JPA / Hibernate (comun a todos los perfiles) ---
spring.jpa.open-in-view=false
# Descomentar cuando exista shared/infrastructure/persistence/jpa/configuration/strategy/SnakeCaseWithPluralizedTablePhysicalNamingStrategy
# spring.jpa.properties.hibernate.physical_naming_strategy=com.olimpiadas369.backend.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Subida de fotos (multipart) ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Proveedor de visión (gemini | claude) ---
vision.provider=${VISION_PROVIDER:gemini}
vision.api-key=${VISION_API_KEY:}
vision.model=${VISION_MODEL:gemini-2.5-flash}

# --- Firebase (Storage de imágenes + Admin SDK) ---
firebase.project-id=${FIREBASE_PROJECT_ID:}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}

# --- Correo (invitación de usuarios con credenciales autogeneradas) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@olimpiadas369.com}

# --- CORS (frontend Angular) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- OpenAPI / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs