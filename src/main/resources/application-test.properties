# H2 en memoria, en modo compatibilidad PostgreSQL. Flyway se desactiva: el esquema sale
# directo de las entidades (ddl-auto=create-drop), así los tests no dependen de que las
# migraciones estén al día.
spring.datasource.url=jdbc:h2:mem:olimpiadas369;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.flyway.enabled=false

# Valores fijos — test nunca lee .env
jwt.secret=clave-de-pruebas-de-al-menos-32-caracteres-no-usar-en-produccion
jwt.expiration-minutes=60

vision.provider=gemini
vision.api-key=test-key
vision.model=gemini-2.5-flash

firebase.project-id=test-project
firebase.storage-bucket=test-bucket
firebase.credentials-base64=

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test

app.cors.allowed-origins=http://localhost:4200

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false